# Sveltia CMS configuration for website feedback (the /feedback inbox):
# feedback items (status), developer notes for testers, and the changelog
# (the Changelog tab of /feedback).
#
# Feedback lives in the PRIVATE repo StefVanremoortele/irie-vibes-feedback,
# not in this public site repo. The production server commits every new
# entry there (FEEDBACK_GIT_SYNC=1) and pulls edits made here, so a status
# change shows up on /feedback within about 30 seconds. Sign in with a GitHub
# token that has access to that private repo.
#
# Only the status and developer comments are meant to be edited; the other
# fields are read-only. Comments are shown under the item on /feedback.

backend:
  name: github
  repo: StefVanremoortele/irie-vibes-feedback
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: feedback
    label: "Feedback"
    label_singular: "Feedback item"
    folder: "entries"
    extension: json
    format: json
    create: false
    delete: true
    identifier_field: id
    summary: "{{status}} · {{message | truncate(80)}}"
    sortable_fields: [createdAt, status, page]
    view_filters:
      - { label: "New", field: status, pattern: "^New$" }
      - { label: "In progress", field: status, pattern: "^In progress$" }
      - { label: "Done", field: status, pattern: "^Done$" }
    view_groups:
      - { label: "Status", field: status }
    fields:
      - { name: status, label: "Status", widget: select, options: ["New", "In progress", "Done"], default: "New" }
      - { name: message, label: "Message", widget: text, readonly: true }
      - name: comments
        label: "Developer comments"
        label_singular: "Comment"
        hint: "Shown under this item on /feedback. Testers' replies (from the inbox) appear here too, under \"Jah a the Creator\"."
        widget: list
        required: false
        summary: "{{fields.author}}: {{fields.message | truncate(60)}}"
        fields:
          - { name: date, label: "Date", widget: datetime, format: "YYYY-MM-DDTHH:mm:ssZ", default: "{{now}}" }
          - { name: author, label: "Author", widget: string, default: "Developer" }
          - { name: message, label: "Comment", widget: markdown, hint: "Markdown. Paste a screenshot straight into the text to add an image." }
      - { name: page, label: "Page", widget: string, readonly: true, required: false }
      - { name: createdAt, label: "Sent", widget: datetime, readonly: true }
      - { name: acceptedAt, label: "Accepted by tester", widget: datetime, readonly: true, required: false, hint: "Set when a tester accepts an in-progress change on /feedback (it then moves to Done)." }
      - { name: screenshot, label: "Screenshot", widget: image, readonly: true, required: false }
      - { name: id, label: "ID", widget: string, readonly: true }
      - { name: name, label: "Name", widget: string, readonly: true }
      - name: images
        label: "Images"
        widget: list
        readonly: true
        required: false
        collapsed: true
        fields:
          - { name: name, label: "File", widget: string }
          - { name: type, label: "Type", widget: string }
          - { name: url, label: "URL", widget: string }
      - name: metadata
        label: "Browser details"
        widget: object
        readonly: true
        required: false
        collapsed: true
        fields:
          - { name: userAgent, label: "Browser", widget: string }
          - name: viewport
            label: "Viewport"
            widget: object
            fields:
              - { name: width, label: "Width", widget: number }
              - { name: height, label: "Height", widget: number }
          - name: scroll
            label: "Scroll position"
            widget: object
            fields:
              - { name: x, label: "X", widget: number, value_type: float }
              - { name: y, label: "Y", widget: number, value_type: float }
          - name: region
            label: "Selected region"
            widget: object
            required: false
            fields:
              - { name: x, label: "X", widget: number, value_type: float }
              - { name: y, label: "Y", widget: number, value_type: float }
              - { name: width, label: "Width", widget: number, value_type: float }
              - { name: height, label: "Height", widget: number, value_type: float }
          - { name: screenshotFailed, label: "Screenshot failed", widget: boolean, required: false }

  - name: notes
    label: "Developer notes"
    label_singular: "Developer note"
    description: "Messages for testers, shown on the Developer notes tab of /feedback (newest first)."
    folder: "notes"
    extension: json
    format: json
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{date | date('YYYY-MM-DD')}} — {{title}}"
    sortable_fields: [date, title]
    fields:
      - { name: title, label: "Title", widget: string }
      - { name: date, label: "Date", widget: datetime, format: "YYYY-MM-DDTHH:mm:ssZ", default: "{{now}}" }
      - { name: author, label: "Author", widget: string, default: "Developer" }
      - { name: message, label: "Message", widget: text, hint: "Plain text; line breaks and links are kept." }
      - { name: page, label: "Related page", widget: string, required: false, hint: "Optional path to test, e.g. /tickets" }

  - name: changelog
    label: "Changelog"
    label_singular: "Changelog post"
    description: "One post per change, shown on the Changelog tab of /feedback as a timeline (newest date first)."
    folder: "changelog"
    extension: json
    format: json
    create: true
    delete: true
    icon: history
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{date | date('YYYY-MM-DD')}} — {{title}}"
    sortable_fields: [date, title]
    fields:
      - { name: date, label: "Date", widget: datetime, format: "YYYY-MM-DD", time_format: false, default: "{{now}}", hint: "The date shown on the timeline." }
      - { name: title, label: "Title", widget: string }
      - { name: status, label: "Status", widget: select, options: ["Action needed"], required: false, hint: "Optional: highlights the post with a pill." }
      - { name: body, label: "Text", widget: markdown, required: false, hint: "Optional. Use `code` for paths like `/where`." }
      - name: items
        label: "Changes"
        label_singular: "Change"
        widget: list
        required: false
        summary: "{{fields.tag}} · {{fields.title}}"
        fields:
          - { name: tag, label: "Tag", widget: select, options: ["New", "Fix", "Change", "Infra", "Dev only"], default: "New" }
          - { name: title, label: "Lead phrase (bold)", widget: string }
          - { name: body, label: "Rest of the sentence", widget: text, required: false, hint: "Markdown; shown after the bold lead phrase." }
