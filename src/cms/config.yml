# Sveltia CMS configuration for the Irie Vibes Roots Festival site.
# Collections map 1:1 to the JSON files in content/. Editors change content
# here; the static site is rebuilt from those same files.
#
# Served as /admin/config.yml by src/pages/admin/config.yml.ts, which sets
# backend.branch to the branch the site is built from: the production admin
# (main) commits to `main` and goes live within seconds; the concept admin (dev)
# commits to `dev`, so test edits never reach production until dev is merged
# into main. See CMS.md and README.md.
#
# Local editing (no cloud needed):
#   Terminal 1:  npm run dev
#   Terminal 2:  npm run cms:proxy  (only for non-Chromium browsers)
#   Open:        http://localhost:4320/admin/index.html  (choose "Work with Local Repository")
#
# Paths here are relative to the repository root.

backend:
  name: github
  repo: StefVanremoortele/irie-vibes
  branch: main # replaced at build time with the branch being built

# Enables the "Work with Local Repository" button when the proxy is running.
local_backend: true

media_folder: "public/assets"
public_folder: "/assets"

# Uploads: photos are scaled down (max 2000px) and converted to WebP in the browser
# before they are committed, so phone photos (5-15 MB) stay small and GitHub accepts them.
# Anything still over 5 MB gets a clear "too large" message instead of "Failed to save image".
# GIFs and SVGs are left as they are.
media_libraries:
  default:
    config:
      max_file_size: 5242880
      transformations:
        jpeg: { format: webp, quality: 85, width: 2000, height: 2000 }
        png: { format: webp, quality: 85, width: 2000, height: 2000 }
        heic: { format: webp, quality: 85, width: 2000, height: 2000 }
        webp: { format: webp, quality: 85, width: 2000, height: 2000 }

collections:
  # ---- Content pages: one entry per page, in the order of the site menu ----
  - name: pages
    label: "Content pages"
    create: false
    icon: description
    files:
      - name: home
        label: "Home"
        file: "content/home.json"
        fields:
          - { name: hero, label: "Hero image", widget: image, required: false, hint: "Banner at the top of this page. Leave empty for no banner." }
          - { name: showHero, label: "Show hero image", widget: boolean, default: true, required: false, hint: "Switch off to hide the banner without removing the image." }
          - { name: datesLabel, label: "Dates label", widget: string }
          - { name: showCountdown, label: "Show countdown", widget: boolean, default: true }
          - { name: festivalDate, label: "Gates open (countdown target)", widget: datetime, format: "YYYY-MM-DDTHH:mm:ss" }
          - { name: intro, label: "Intro text", widget: text, hint: "Enter = new line, empty line = new paragraph. Allows `<strong>bold</strong>` and `<a href=\"…\">link</a>`." }
          - { name: showAftermovie, label: "Show aftermovie", widget: boolean, default: true }
          - name: aftermovie
            label: "Aftermovie"
            widget: object
            collapsed: true
            fields:
              - { name: title, label: "Title", widget: string }
              - { name: embedUrl, label: "YouTube embed URL", widget: string }
      - name: lineup
        label: "Line-up"
        file: "content/lineup.json"
        description: "The acts themselves are edited under Line-up — acts."
        fields:
          - { name: hero, label: "Hero image", widget: image, required: false, hint: "Banner at the top of this page. Leave empty for no banner." }
          - { name: showHero, label: "Show hero image", widget: boolean, default: true, required: false, hint: "Switch off to hide the banner without removing the image." }
          - { name: actHero, label: "Act pages: hero image", widget: image, required: false, hint: "Banner at the top of every act's detail page. Leave empty for no banner." }
          - { name: showActHero, label: "Act pages: show hero image", widget: boolean, default: true, required: false }
          - name: stages
            label: "Stages"
            widget: list
            collapsed: true
            minimize_collapsed: true
            fields:
              - { name: key, label: "Key (inner/den/chill)", widget: string }
              - { name: name, label: "Name", widget: string }
              - { name: sub, label: "Sub-label", widget: string }
              - { name: color, label: "Accent colour", widget: string }
          - name: days
            label: "Days"
            widget: list
            collapsed: true
            minimize_collapsed: true
            fields:
              - { name: name, label: "Name", widget: string }
              - { name: sub, label: "Sub-label", widget: string, required: false }
              - { name: order, label: "Order", widget: number, value_type: int }
          - { name: useCustomHtml, label: "Use custom HTML", widget: boolean, default: false, hint: "When enabled, replaces the CMS-managed line-up grid." }
          - { name: customHtml, label: "Custom HTML", widget: text, required: false }
      - name: tickets
        label: "Tickets"
        file: "content/pages/tickets.json"
        fields:
          - { name: slug, label: "Slug", widget: hidden }
          - { name: title, label: "Title", widget: string }
          - { name: hero, label: "Hero image", widget: image, required: false, hint: "Banner at the top of this page. Leave empty for no banner." }
          - { name: showHero, label: "Show hero image", widget: boolean, default: true, required: false, hint: "Switch off to hide the banner without removing the image." }
          - name: blocks
            label: "Content blocks"
            widget: list
            required: false
            collapsed: true
            minimize_collapsed: true
            summary: "{{fields.html}}"
            fields: &copyBlockFields
              - { name: type, label: "Type", widget: select, options: [{ label: "Paragraph", value: "p" }, { label: "Heading", value: "h" }], default: "p" }
              - { name: html, label: "Text", widget: text, hint: "Paragraph: Enter = new line, empty line = new paragraph. Allows `<strong>bold</strong>` and `<a href=\"…\">link</a>` (also in headings)." }
          - { name: showSocials, label: "Show social links", widget: boolean, default: false, required: false, hint: "Lists the Social links of Site settings (icon + name) under the content blocks." }
          - { name: useCustomHtml, label: "Use custom HTML", widget: boolean, default: false, required: false, hint: "When on, the Custom HTML below is shown instead of the content blocks (and social links)." }
          - { name: customHtml, label: "Custom HTML", widget: text, required: false, hint: "Shown as-is (no line-break handling): use `<p>`, `<br>`, `<strong>`, `<a href=\"…\">` etc." }
      - name: when
        label: "When"
        file: "content/pages/when.json"
        fields: &contentPageFields
          - { name: slug, label: "Slug", widget: hidden }
          - { name: title, label: "Title", widget: string }
          - { name: hero, label: "Hero image", widget: image, required: false, hint: "Banner at the top of this page. Leave empty for no banner." }
          - { name: showHero, label: "Show hero image", widget: boolean, default: true, required: false, hint: "Switch off to hide the banner without removing the image." }
          - name: blocks
            label: "Content blocks"
            widget: list
            required: false
            collapsed: true
            minimize_collapsed: true
            summary: "{{fields.html}}"
            fields: *copyBlockFields
          - { name: showSocials, label: "Show social links", widget: boolean, default: false, required: false, hint: "Lists the Social links of Site settings (icon + name) under the content blocks." }
      - name: where
        label: "Where"
        file: "content/pages/where.json"
        description: "The Google Maps tile uses the location in Site settings."
        fields:
          - { name: slug, label: "Slug", widget: hidden }
          - { name: title, label: "Title", widget: string }
          - { name: hero, label: "Hero image", widget: image, required: false, hint: "Banner at the top of this page. Leave empty for no banner." }
          - { name: showHero, label: "Show hero image", widget: boolean, default: true, required: false, hint: "Switch off to hide the banner without removing the image." }
          - { name: circulatieplan, label: "Circulation plan", widget: image, required: false, hint: "Shown next to the map. Leave empty to show only the map." }
          - name: blocks
            label: "Content blocks"
            widget: list
            collapsed: true
            minimize_collapsed: true
            summary: "{{fields.html}}"
            fields: *copyBlockFields
      - name: camping
        label: "Parking & camping"
        file: "content/pages/camping.json"
        fields: *contentPageFields
      - name: drinks
        label: "Drinks, food & market"
        file: "content/pages/drinks.json"
        fields: *contentPageFields
      - name: kids
        label: "Kids corner"
        file: "content/pages/kids.json"
        fields: *contentPageFields
      - name: volunteer
        label: "Volunteer"
        file: "content/pages/volunteer.json"
        fields: *contentPageFields
      - name: about
        label: "All about Irie Vibes"
        file: "content/about.json"
        description: "One block per category (accordion) on the page, each with its own title, show switch and content."
        fields:
          - { name: hero, label: "Hero image", widget: image, required: false, hint: "Banner at the top of this page. Leave empty for no banner." }
          - { name: showHero, label: "Show hero image", widget: boolean, default: true, required: false, hint: "Switch off to hide the banner without removing the image." }
          - name: order
            label: "Category order"
            widget: list
            collapsed: true
            minimize_collapsed: true
            allow_add: false
            allow_remove: false
            allow_duplicate: false
            hint: "Top to bottom as on the page. Reorder with the drag handle or the arrow buttons of each row. To hide a category, switch off \"Show on the site\" in its own block."
            field: { name: key, label: "Category", widget: select, options: [{ label: "VZW Greenforward", value: "greenforward" }, { label: "Initiatives & partnerships", value: "initiatives" }, { label: "Previous editions", value: "editions" }, { label: "Irie shop", value: "shop" }, { label: "The Irie Vibes band", value: "band" }] }
          - name: greenforward
            label: "VZW Greenforward"
            widget: object
            collapsed: true
            fields:
              - { name: title, label: "Title", widget: string, hint: "Accordion title on the site." }
              - { name: visible, label: "Show on the site", widget: boolean, default: true, required: false }
              - name: blocks
                label: "Text"
                widget: list
                collapsed: true
                minimize_collapsed: true
                summary: "{{fields.text}}"
                fields:
                  - { name: type, label: "Type", widget: select, options: [{ label: "Heading", value: "h" }, { label: "Paragraph", value: "p" }], default: "p" }
                  - { name: text, label: "Text", widget: text, hint: "Enter = new line, empty line = new paragraph. Allows `<strong>bold</strong>` and `<a href=\"…\">link</a>`." }
          - name: initiatives
            label: "Initiatives & partnerships"
            widget: object
            collapsed: true
            fields:
              - { name: title, label: "Title", widget: string, hint: "Accordion title on the site." }
              - { name: visible, label: "Show on the site", widget: boolean, default: true, required: false }
              - name: blocks
                label: "Text"
                widget: list
                collapsed: true
                minimize_collapsed: true
                summary: "{{fields.text}}"
                fields:
                  - { name: type, label: "Type", widget: select, options: [{ label: "Heading", value: "h" }, { label: "Paragraph", value: "p" }], default: "p" }
                  - { name: text, label: "Text", widget: text, hint: "Enter = new line, empty line = new paragraph. Allows `<strong>bold</strong>` and `<a href=\"…\">link</a>`." }
          - name: editions
            label: "Previous editions"
            widget: object
            collapsed: true
            fields:
              - { name: title, label: "Title", widget: string, hint: "Accordion title on the site." }
              - { name: visible, label: "Show on the site", widget: boolean, default: true, required: false }
              - name: items
                label: "Editions"
                widget: list
                add_to_top: true
                hint: "New editions are added at the top (newest first). The site always shows the editions in year order, whatever the order here."
                collapsed: true
                minimize_collapsed: true
                summary: "{{fields.year}}"
                fields:
                  - { name: year, label: "Year", widget: string, pattern: ["^[0-9]{4}$", "A 4-digit year, e.g. 2002"] }
                  - { name: poster, label: "Poster", widget: image, required: false }
                  - { name: video, label: "YouTube video URL", widget: string, required: false, hint: "Aftermovie, shown under the poster." }
                  - { name: showVideo, label: "Show video", widget: boolean, default: true, required: false }
                  - { name: photo, label: "Group photo", widget: image, required: false, hint: "Crew group photo, shown under the poster (and video)." }
                  - { name: showPhoto, label: "Show group photo", widget: boolean, default: true, required: false }
                  - name: paragraphs
                    label: "Paragraphs"
                    widget: list
                    required: false
                    hint: "Optional. Leave empty to show no text for this year."
                    collapsed: true
                    minimize_collapsed: true
                    field: { name: paragraph, label: "Paragraph", widget: text, hint: "Enter = new line, empty line = new paragraph. Allows `<strong>bold</strong>` and `<a href=\"…\">link</a>`." }
          - name: shop
            label: "Irie shop"
            widget: object
            collapsed: true
            fields:
              - { name: title, label: "Title", widget: string, hint: "Accordion title on the site." }
              - { name: visible, label: "Show on the site", widget: boolean, default: true, required: false }
              - { name: intro, label: "Intro", widget: text, hint: "Enter = new line, empty line = new paragraph. Allows `<strong>bold</strong>` and `<a href=\"…\">link</a>`." }
              - name: items
                label: "Items"
                widget: list
                collapsed: true
                minimize_collapsed: true
                summary: "{{fields.name}}"
                fields:
                  - { name: name, label: "Name", widget: string }
                  - { name: description, label: "Description", widget: text, hint: "Enter = new line, empty line = new paragraph. Allows `<strong>bold</strong>` and `<a href=\"…\">link</a>`." }
                  - { name: image, label: "Product image", widget: image, required: false }
          - name: band
            label: "The Irie Vibes band"
            widget: object
            collapsed: true
            fields:
              - { name: title, label: "Title", widget: string, hint: "Accordion title on the site." }
              - { name: visible, label: "Show on the site", widget: boolean, default: true, required: false }
              - { name: text, label: "Text", widget: text, hint: "Enter = new line, empty line = new paragraph. Allows `<strong>bold</strong>` and `<a href=\"…\">link</a>`." }
              - name: media
                label: "Band photos & videos"
                widget: list
                required: false
                collapsed: true
                minimize_collapsed: true
                summary: "{{fields.caption}}"
                hint: "Shown right of the band text on wide screens, below it on small screens. Add a photo or a video; the description shows below a photo and above a video."
                types:
                  - name: photo
                    label: "Photo"
                    summary: "Photo: {{fields.caption}}"
                    fields:
                      - { name: photo, label: "Photo", widget: image }
                      - { name: caption, label: "Description", widget: string, required: false, hint: "Shown below the photo (also its alt text)." }
                  - name: video
                    label: "Video"
                    summary: "Video: {{fields.caption}}"
                    fields:
                      - { name: video, label: "YouTube video URL", widget: string }
                      - { name: caption, label: "Description", widget: string, required: false, hint: "Shown above the video." }
      - name: regulations
        label: "Regulations"
        file: "content/regulations.json"
        fields:
          - { name: hero, label: "Hero image", widget: image, required: false, hint: "Banner at the top of this page. Leave empty for no banner." }
          - { name: showHero, label: "Show hero image", widget: boolean, default: true, required: false, hint: "Switch off to hide the banner without removing the image." }
          - name: sections
            label: "Sections"
            widget: list
            collapsed: true
            minimize_collapsed: true
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: "Title", widget: string }
              - name: items
                label: "Items"
                widget: list
                collapsed: true
                minimize_collapsed: true
                fields:
                  - { name: p, label: "Paragraph", widget: text, required: false, hint: "Enter = new line, empty line = new paragraph. Allows `<strong>bold</strong>` and `<a href=\"…\">link</a>`." }
                  - name: ul
                    label: "Bullet list"
                    widget: list
                    collapsed: true
                    minimize_collapsed: true
                    required: false
                    field: { name: item, label: "Item", widget: string, hint: "Allows `<strong>bold</strong>` and `<a href=\"…\">link</a>`." }

      # @menu-pages: entries for menu links without a page of their own are added here (src/pages/admin/config.yml.ts)

  # ---- Line-up acts (one file per act) ---------------------------------
  - name: acts
    label: "Line-up — acts"
    label_singular: "Act"
    folder: "content/acts"
    extension: json
    format: json
    identifier_field: name
    create: true
    icon: music_note
    summary: "{{fields.day}} · {{fields.time}} — {{fields.name}}"
    fields:
      - { name: name, label: "Act name", widget: string }
      - { name: day, label: "Day", widget: select, options: ["Thursday", "Friday", "Saturday"] }
      - name: stage
        label: "Stage"
        widget: select
        options:
          - { label: "Inner Lion (open air)", value: "inner" }
          - { label: "Lions Den (main)", value: "den" }
          - { label: "Chilling Lion (camping)", value: "chill" }
      - { name: time, label: "Time", widget: string, hint: "e.g. 18:00 - 19:00" }
      - { name: order, label: "Order within stage", widget: number, value_type: int, default: 1 }
      - { name: image, label: "Artist image", widget: image, required: false }
      - name: description
        label: "Description (detail page)"
        widget: text
        required: false
        hint: "Optional act bio or detail-page copy. Enter = new line, empty line = new paragraph. Allows `<strong>bold</strong>` and `<a href=\"…\">link</a>`."


  # ---- Settings: things that apply to the whole site ---------------------
  - name: settings
    label: "Settings"
    files:
      - name: site
        label: "Site settings"
        file: "content/site.json"
        icon: settings
        fields:
          - { name: name, label: "Festival name", widget: string }
          - { name: organisation, label: "Organisation", widget: string }
          - name: location
            label: "Location"
            widget: object
            collapsed: true
            fields:
              - { name: label, label: "Address label", widget: string }
              - { name: query, label: "Map search query", widget: string }
          - { name: email, label: "Contact email", widget: string }
          - { name: ticketUrl, label: "Ticket shop URL", widget: string }
          - { name: volunteerUrl, label: "Volunteer link", widget: string }
          - { name: menuAnimation, label: "Menu button animation", widget: boolean, default: true, required: false, hint: "The spinning record on the menu button (top left). Visitors whose device asks for fewer animations always see the still button." }
          - { name: themeColor, label: "Theme text colour", widget: color, default: "#fabc4d", required: false, hint: "The yellow of titles, links, buttons and the countdown on every page (stage colours are set per stage under Line-up). Pick a light colour: dark colours are hard to read on the dark background. Empty: the festival gold #fabc4d." }
          - name: assets
            label: "Sticky images"
            widget: object
            collapsed: true
            fields:
              - { name: headerBanner, label: "Header banner", widget: image }
              - { name: footerBg, label: "Footer background", widget: image }
              - { name: greenforward, label: "Greenforward logo", widget: image }
              - { name: ticketButton, label: "Ticket button image", widget: image, required: false, hint: "Optional. Shown as the round ticket button in the header (top right); a square image works best. Leave empty for the \"GET YOUR TICKET\" text button." }
              - { name: menuButton, label: "Menu button image", widget: image, required: false, hint: "Optional. Replaces the record icon of the round menu button (top left); a square image works best. Leave empty for the animated record." }
          - name: nav
            label: "Page navigation"
            label_singular: "Page"
            widget: list
            collapsed: true
            minimize_collapsed: true
            summary: "{{fields.label}}"
            hint: "Top to bottom is the order of the burger menu. Switch off \"Show in burger menu\" to keep a page out of the menu."
            fields:
              - { name: label, label: "Label", widget: string }
              - { name: href, label: "Link", widget: string, hint: "A page of this site (/tickets) or a full address (https://…). A link like /info-markt to a page the site doesn't have yet creates that page (empty, with header and footer); after saving, reload the admin to find it under Content pages." }
              - { name: showInMenu, label: "Show in burger menu", widget: boolean, default: true, required: false }
          - name: socials
            label: "Social links"
            widget: list
            collapsed: true
            minimize_collapsed: true
            fields:
              - { name: label, label: "Label", widget: string }
              - { name: href, label: "URL", widget: string }
              - { name: icon, label: "Icon", widget: image }

      - name: sponsors
        label: "Sponsors"
        file: "content/sponsors.json"
        icon: handshake
        fields:
          - name: main
            label: "Main partners"
            widget: list
            collapsed: true
            minimize_collapsed: true
            summary: "{{fields.alt}}{{fields.label}}"
            thumbnail: image
            hint: "Shown on the site in this order. Reorder with the drag handle or the arrow buttons of each row."
            fields:
              - { name: image, label: "Logo", widget: image, required: false }
              - { name: alt, label: "Name (alt text)", widget: string, required: false }
              - { name: label, label: "Text label (no logo)", widget: string, required: false }
              - { name: sub, label: "Text sub-label", widget: string, required: false }
          - name: regular
            label: "Regular sponsors"
            widget: list
            collapsed: true
            minimize_collapsed: true
            summary: "{{fields.alt}}{{fields.label}}"
            thumbnail: image
            hint: "Shown on the site in this order. Reorder with the drag handle or the arrow buttons of each row."
            fields:
              - { name: image, label: "Logo", widget: image, required: false }
              - { name: alt, label: "Name (alt text)", widget: string, required: false }
              - { name: label, label: "Text label (no logo)", widget: string, required: false }
              - { name: sub, label: "Text sub-label", widget: string, required: false }
